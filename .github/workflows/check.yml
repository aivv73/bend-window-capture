name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libx11-dev xvfb xauth
      - name: Install Bend
        run: |
          archive=bend-2.0.37-linux-x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/bendlang/bend/releases/download/v2.0.37/$archive"
          echo "84c32465a39bc9ac315eade23f470cb8db03153dc860f89564fcfec153c3e445  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.bend"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check compiler version
        run: |
          bend version
          bend version | grep -Eq '(^|[^0-9])2\.0\.37([^0-9]|$)'
      - name: Check API contract and native capture
        run: xvfb-run -a ./scripts/check.sh
