name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libx11-dev xvfb xauth
      - name: Install Bend
        run: |
          archive=bend-2.0.40-linux-x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/bendlang/bend/releases/download/v2.0.40/$archive"
          echo "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.bend"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.bend" --strip-components=1
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check compiler version
        run: |
          bend version
          bend version | grep -Eq '(^|[^0-9])2\.0\.40([^0-9]|$)'
      - name: Check API contract and native capture
        run: xvfb-run -a ./scripts/check.sh
