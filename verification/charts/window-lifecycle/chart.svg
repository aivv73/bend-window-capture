<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 645 835" width="645" height="835" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state"><style>
.pele { --pele-bg: transparent; --pele-fg: var(--foreground, #1c1c1c);
  --pele-muted: var(--muted-foreground, #656565); --pele-line: var(--muted-foreground, #808080);
  --pele-surface: var(--card, #fcfcfc); --pele-surface-alt: var(--secondary, #f1f1f1);
  --pele-border: var(--border, #c9c9c9); --pele-font: var(--font-sans, sans-serif); }
.pele .blue rect { fill: color-mix(in srgb, var(--info, #c3e0ff) 20%, var(--card, #ffffff)); }
.pele .teal rect { fill: color-mix(in srgb, var(--success, #bfe3df) 20%, var(--card, #ffffff)); }
.pele .orange rect { fill: color-mix(in srgb, var(--warning, #f0d3bf) 20%, var(--card, #ffffff)); }
.pele .breaks rect { fill: var(--destructive-surface, #ffecee) !important;
  stroke: var(--destructive, #e72e3b) !important; stroke-width: 2.5px !important; }
.pele .breaks text { fill: var(--destructive, #cd2834) !important; }
.pele .mayBreak rect { fill: var(--warning-surface, #fff3e6) !important;
  stroke: var(--warning, #e8730c) !important; stroke-width: 2.5px !important; }
.pele .mayBreak text { fill: var(--warning, #b85a06) !important; }
.pele .bugPath rect { stroke: var(--info, #1680f3) !important; stroke-width: 2.5px !important; }
.pele .repeats rect { stroke: var(--chart-3, #9b35d6) !important; stroke-width: 2.5px !important; stroke-dasharray: 6 3; }
@media (prefers-color-scheme: dark) {
 .pele { --pele-fg: var(--foreground, #f5f5f5); --pele-muted: var(--muted-foreground, #acacac);
   --pele-line: var(--muted-foreground, #939393); --pele-surface: var(--card, #121212);
   --pele-surface-alt: var(--secondary, #2c2c2c); --pele-border: var(--border, #4e4e4e); }
 .pele .blue rect { fill: color-mix(in srgb, var(--info, #1b3857) 20%, var(--card, #121212)); }
 .pele .teal rect { fill: color-mix(in srgb, var(--success, #174641) 20%, var(--card, #121212)); }
 .pele .orange rect { fill: color-mix(in srgb, var(--warning, #573117) 20%, var(--card, #121212)); }
 .pele .breaks rect { fill: var(--destructive-surface, #2e2021) !important; }
 .pele .breaks text { fill: var(--destructive, #ff6463) !important; }
}
</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="322.5" y="25.6">Capture a window, close it, then read its pixels</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="255.96" y="8" width="380.51" height="112" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M255.96,44H636.47" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="446.22" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M208.96,120L208.96,157"/><path class="pele-marker" d="M208.96,164L205.6,156L212.32,156Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M179.15,208C179.15,217.25 107.15,217.25 107.15,226.5L107.15,270"/><path class="pele-marker" d="M107.15,277L103.79,269L110.51,269Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M238.77,208C238.77,217.25 310.77,217.25 310.77,226.5L310.77,270"/><path class="pele-marker" d="M310.77,277L307.41,269L314.13,269Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M310.77,321L310.77,383"/><path class="pele-marker" d="M310.77,390L307.41,382L314.13,382Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M300.53,434C300.53,443.25 186.96,443.25 186.96,452.5L186.96,496"/><path class="pele-marker" d="M186.96,503L183.6,495L190.32,495Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M321.01,434C321.01,443.25 434.58,443.25 434.58,452.5L434.58,496"/><path class="pele-marker" d="M434.58,503L431.22,495L437.94,495Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><pat