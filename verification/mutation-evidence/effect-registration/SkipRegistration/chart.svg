<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 801 398" width="801" height="398" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state"><style>
.pele { --pele-bg: transparent; --pele-fg: var(--foreground, #1c1c1c);
  --pele-muted: var(--muted-foreground, #656565); --pele-line: var(--muted-foreground, #808080);
  --pele-surface: var(--card, #fcfcfc); --pele-surface-alt: var(--secondary, #f1f1f1);
  --pele-border: var(--border, #c9c9c9); --pele-font: var(--font-sans, sans-serif); }
.pele .blue rect { fill: color-mix(in srgb, var(--info, #c3e0ff) 20%, var(--card, #ffffff)); }
.pele .teal rect { fill: color-mix(in srgb, var(--success, #bfe3df) 20%, var(--card, #ffffff)); }
.pele .orange rect { fill: color-mix(in srgb, var(--warning, #f0d3bf) 20%, var(--card, #ffffff)); }
.pele .breaks rect { fill: var(--destructive-surface, #ffecee) !important;
  stroke: var(--destructive, #e72e3b) !important; stroke-width: 2.5px !important; }
.pele .breaks text { fill: var(--destructive, #cd2834) !important; }
.pele .mayBreak rect { fill: var(--warning-surface, #fff3e6) !important;
  stroke: var(--warning, #e8730c) !important; stroke-width: 2.5px !important; }
.pele .mayBreak text { fill: var(--warning, #b85a06) !important; }
.pele .bugPath rect { stroke: var(--info, #1680f3) !important; stroke-width: 2.5px !important; }
.pele .repeats rect { stroke: var(--chart-3, #9b35d6) !important; stroke-width: 2.5px !important; stroke-dasharray: 6 3; }
@media (prefers-color-scheme: dark) {
 .pele { --pele-fg: var(--foreground, #f5f5f5); --pele-muted: var(--muted-foreground, #acacac);
   --pele-line: var(--muted-foreground, #939393); --pele-surface: var(--card, #121212);
   --pele-surface-alt: var(--secondary, #2c2c2c); --pele-border: var(--border, #4e4e4e); }
 .pele .blue rect { fill: color-mix(in srgb, var(--info, #1b3857) 20%, var(--card, #121212)); }
 .pele .teal rect { fill: color-mix(in srgb, var(--success, #174641) 20%, var(--card, #121212)); }
 .pele .orange rect { fill: color-mix(in srgb, var(--warning, #573117) 20%, var(--card, #121212)); }
 .pele .breaks rect { fill: var(--destructive-surface, #2e2021) !important; }
 .pele .breaks text { fill: var(--destructive, #ff6463) !important; }
}
</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="400.5" y="25.6">Load the capture module before dispatching its effect</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="157.7" y="8" width="634.83" height="130" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M157.7,44H792.53" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="475.11" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M110.7,138L110.7,175"/><path class="pele-marker" d="M110.7,182L107.34,174L114.06,174Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M110.7,226L110.7,303"/><path class="pele-marker" d="M110.7,310L107.34,302L114.06,302Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="40.94" y="246.5" width="139.5" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="110.7" y="260.4">module loads without</tspan><tspan x="110.7" y="278.4">registering capture</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state blue bugPath" data-id="s0" transform="translate(110.7,204)"><rect x="-70.25" y="-22" width="140.5" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Module loading</text></g><g class="pele-node pele-state blue breaks bugPath" data-id="s1" transform="translate(110.7,332)"><rect x="-102.7" y="-22" width="205.39" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)" style="fill:#ffecee;stroke:#e72e3b;stroke-width:2.5px;"/><text class="pele-label" style="fill:#cd2834;" x="0" y="5.6" text-anchor="middle">Capture handler missing</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(110.7,131)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state blue" data-id="lg0" transform="translate(229.26,91)"><rect x="-55.57" y="-22" width="111.14" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">in progress</text></g><g class="pele-node pele-state breaks" data-id="lg1" transform="translate(420.86,91)"><rect x="-96.02" y="-31" width="192.05" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)" style="fill:#ffecee;stroke:#e72e3b;stroke-width:2.5px;"/><text class="pele-label" style="fill:#cd2834;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Breaks NoDeadlock or</tspan><tspan x="0" y="16.1">ReadyHasHandler</tspan></text></g><g class="pele-node pele-state bugPath" data-id="lg2" transform="translate(666.7,91)"><rect x="-109.82" y="-31" width="219.65" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Path to the NoDeadlock or</tspan><tspan x="0" y="16.1">ReadyHasHandler bug</tspan></text></g></g></g></svg>